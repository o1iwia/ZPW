<html>
    <head>
        <title>strona glowna</title>
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script>
            $(function() {
               $("#formularz").submit(function(e) {
                    e.preventDefault();
                    if($("#nick").val()==="") {
                        $("#info").text("podaj nick");
                    } else {
                        $("#info").text("przeslano nick "+$("#nick").val());
                    }
               })
               $("#formularz2").submit(function(e){
                     e.preventDefault();
                     if($("#pass").val().length >=6){
                        $("#info2").text("zalogowano").css("color","green");
                     } else {
                        $("#info2").text("haslo jest za krotkie").css("color","red");
                     }
               })
            })


        </script>
        <style>
         
            
        </style>
    </head>
    <body>
           <form id="formularz">
            <input type="text" id="nick">
            <button type="submit">wyslij</button>
           </form>
           <p id="info"></p>
           <hr>
           <form id="formularz2">
            <input type="email" id="email">
            <input type="password" name="pass" id="pass">
            <button type="submit2">wyslij</button>
           </form>
           <p id="info2"></p>

    </body>
</html>
