<html>
    <head>
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script>
          $(function() {
            //Object Event
            $(document).on("keydown keyup keypress", function(event) {
                $("#eventType").text(event.type);
            })

             $(document).on("mousemove", function() {
                $("#pageX").text(event.pageX);
                $("#pageY").text(event.pageY);
            })
             })
            //stworzyc kwadrat 200x200 czerwony, po nacisnieciu literki d przesuwa w prawo,a w lewo
            
            $(function() {
                $("#jablko").css({ 
                    "margin-left": Math.floor((Math.random() * 1000) + 1) + "px", 
                    "margin-top": Math.floor((Math.random() * 1000) + 1) + "px" 
                    }); 
               
                let positionX =0;
                let positionY =0;
                $(document).on("keydown", function() {
                    if(event.key == "a") {
                       positionX = positionX - 10;
                       $("#kwadrat").css("margin-left",positionX+"px");
                    } 
                    if(event.key == "d") {
                       positionX = positionX + 10;
                        $("#kwadrat").css("margin-left",positionX+"px");
                    }
                     if(event.key == "w") {
                       positionY = positionY - 10;
                       $("#kwadrat").css("margin-top",positionY+"px");
                    } 
                    if(event.key == "s") {
                       positionY = positionY + 10;
                        $("#kwadrat").css("margin-top",positionY+"px");
                    }
                })
            })
            //jak dojdzie do kolizji to jablko znika a kwadrat zwieksza sie o 10px w kazda strine
         
        </script>
         <style>
        
        #kwadrat {
            width: 200px;
            height: 200px;
            background-color: red
        }
        #jablko {
            width: 20px;
            height: 20px;
            background-color: green
        }
    </style>
    </head>
    <body>

            </p>-->

    </body> 
</html>
