<html>
    <head>
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script>
          $(function() {
            //Object Event
            $(document).on("keydown keyup keypress", function(event) {
                $("#eventType").text(event.type);
            })

            $(document).on("mousemove", function(event) {
                $("#pageX").text(event.pageX);
                $("#pageY").text(event.pageY);
            })
          })
          $(document).on("keydown keypress keyup", function(event) {
            $("#eventType").text()
          })
            //stworzyc kwadrat 200x200 czerwony, po nacisnieciu literki d przesuwa w prawo,a w lewo
            
            $(function() {
                $("#jablko").css({ 
                    "left": Math.floor((Math.random() * 1000) + 1) + "px", 
                    "top": Math.floor((Math.random() * 1000) + 1) + "px" 
                }); 
               
                let positionX = 0;
                let positionY = 0;
                let rozmiar = 200;

                function sprawdzKolizje() {
                    let jX = parseInt($("#jablko").css("left"));
                    let jY = parseInt($("#jablko").css("top"));

                    
                    if (positionX < jX + 20 && positionX + rozmiar > jX &&
                        positionY < jY + 20 && positionY + rozmiar > jY) {
                        
                        
                        $("#jablko").css({
                            "left": Math.floor((Math.random() * 1000) + 1) + "px",
                            "top": Math.floor((Math.random() * 1000) + 1) + "px"
                        });

                        
                        rozmiar += 20;
                        positionX -= 10;
                        positionY -= 10;

                        $("#kwadrat").css({
                            "width": rozmiar + "px",
                            "height": rozmiar + "px",
                            "left": positionX + "px",
                            "top": positionY + "px"
                        });
                    }
                }

                $(document).on("keydown", function(event) {
                    if(event.key == "a" || event.key == "A") {
                       positionX = positionX - 10;
                       $("#kwadrat").css("left", positionX + "px");
                    } 
                    if(event.key == "d" || event.key == "D") {
                       positionX = positionX + 10;
                       $("#kwadrat").css("left", positionX + "px");
                    }
                    if(event.key == "w" || event.key == "W") {
                       positionY = positionY - 10;
                       $("#kwadrat").css("top", positionY + "px");  
                    } 
                    if(event.key == "s" || event.key == "S") {
                       positionY = positionY + 10;
                       $("#kwadrat").css("top", positionY + "px");
                    }

                    sprawdzKolizje();
                })
            })
            //jak dojdzie do kolizji to jablko znika a kwadrat zwieksza sie o 10px w kazda strine

           
         
        </script>
        <style>
        #kwadrat {
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
            left: 0px;
            top: 0px;
        }
        
        #jablko {
            width: 20px;
            height: 20px;
            background-color: green;
            position: absolute;
        }
    </style>
    </head>
    <body>
        
            <input type="text" name="pole" id="pole">
            <p>
                Typ zdarzenia:
                <span id="eventType">---</span>
            </p>
            <p>
                Pozycja myszy:
                X = <span id="pageX">---</span>,
                Y = <span id="pageY">---</span>
            </p>
            <div id="kwadrat"></div>
            <div id="jablko"></div>
            
    </body> 
</html>
<html>
    <head>
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script>
            //wylosowac 10 liczb i ma byc 10 kwadratow, jak klikam przycisk to sie pojawia kwadrat
          $(function(){       
                    $("#przycisk").on("click",function(){
                        let liczba = Math.floor(Math.random()*10)+1;
                        for(let i =0;i<liczba;i++) {
                            $("#kon").append('<div class="kwadrat"></div>')
                        }
                    })
                });



                $(function() {
                    let licznik=0;
                    $("#start").on("click", function() {
                        $("#kolko").css({ 
                        "left": Math.floor((Math.random() * 1000) + 1) + "px", 
                        "top": Math.floor((Math.random() * 1000) + 1) + "px" 
                        
                }); 
                
                    })
                    $("#kolko").on("click", function() {
                        licznik++
                        $("#txt").text(licznik)
                        $(this).hide();
                         drawCircle();
                         $(this).show();
                    })
                    function drawCircle() {
                        $("#kolko").css({ 
                        "left": Math.floor((Math.random() * 1000) + 1) + "px", 
                        "top": Math.floor((Math.random() * 1000) + 1) + "px" 
                        
                    }); 
                    }
                })
            
         
        </script>
        <style>
       .kwadrat {
            width: 200px;
            height: 200px;
            background-color: red;
            margin: 5px;
        }
        #kolko {
              width: 50px;
            height: 50px;
            background-color: rgb(110, 71, 133);
            position: absolute;
            border-radius: 50px;
           
        }
        #txt {
            display: inline-block;
            margin-left: 5px;
        }
    </style>
    </head>
    <body>
            <!-- <div id="kon"></div>
            <button id="przycisk">pokaz kwadrat</button> -->
            <button id="start">start</button>
            <p id="txt"></p>
            <div id="kolko"></div>

    </body> 
</html>
